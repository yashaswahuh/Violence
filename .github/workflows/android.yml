name: Android CI

# Builds the phone and TV debug APKs in the cloud and uploads them as downloadable artifacts
# (Actions -> the run -> Artifacts). Runs on a push to violence-nk that touches Android or shared
# code (docs-only and web-only changes do not), or by hand. See fork-docs/CI_DEPLOY.md.
#
# Optional values, all read from the environment and all safe to leave unset (the build still works):
#   secrets   LASTFM_API_KEY, LASTFM_SECRET     Last.fm scrobbling (empty = shows as not configured)
#   variables JAM_BACKEND_URL, JAM_INVITE_BASE_URL   the Jam server and the invite-link base
# Debug builds only: no release, no signing secrets (Phase 7 adds proper signing).

on:
  push:
    branches: [violence-nk]
    paths:
      - 'app/**'
      - 'tv/**'
      - 'shared/**'
      - 'sharedUi/**'
      - 'native/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apks:
    name: Build phone and TV debug APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # JDK 17 runs the Android build (AGP 8.10). JDK 21 is installed as well: the dormant desktop
      # module is part of the Gradle build and declares a Java 21 toolchain (desktopApp/build.gradle.kts),
      # so Gradle needs one on disk even for a phone-only build. The last version listed is JAVA_HOME.
      - name: Set up JDK 21 and 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            17

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      # The packages this project compiles against (versions as used on the owner's machine).
      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-37.0" "platforms;android-36" "cmake;3.22.1" "ndk;27.0.12077973"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build phone and TV debug APKs
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          JAM_BACKEND_URL: ${{ vars.JAM_BACKEND_URL }}
          JAM_INVITE_BASE_URL: ${{ vars.JAM_INVITE_BASE_URL }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDevDebug :tv:assembleDevDebug \
            -Pviolence.bundleWear=false \
            -Porg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64 \
            --stacktrace

      - name: Name the APKs
        id: apks
        run: |
          SHORT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          mkdir -p dist-apks
          pick() { find "$1" -name '*universal*.apk' | head -n 1; }
          PHONE_APK="$(pick app/build/outputs/apk/dev/debug)"
          TV_APK="$(pick tv/build/outputs/apk/dev/debug)"
          [ -n "$PHONE_APK" ] || { echo "::error::no phone universal APK was produced"; exit 1; }
          [ -n "$TV_APK" ] || { echo "::error::no TV universal APK was produced"; exit 1; }
          cp "$PHONE_APK" "dist-apks/violence-phone-debug-${SHORT_SHA}.apk"
          cp "$TV_APK" "dist-apks/violence-tv-debug-${SHORT_SHA}.apk"
          echo "sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          ls -l dist-apks

      - name: Upload phone APK
        uses: actions/upload-artifact@v4
        with:
          name: violence-phone-debug-${{ steps.apks.outputs.sha }}
          path: dist-apks/violence-phone-debug-*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload TV APK
        uses: actions/upload-artifact@v4
        with:
          name: violence-tv-debug-${{ steps.apks.outputs.sha }}
          path: dist-apks/violence-tv-debug-*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Write job summary
        env:
          SHA: ${{ steps.apks.outputs.sha }}
        run: |
          {
            echo "### Android debug builds for \`${SHA}\`"
            echo ""
            echo "- **Phone:** \`violence-phone-debug-${SHA}.apk\`"
            echo "- **TV:** \`violence-tv-debug-${SHA}.apk\`"
            echo ""
            echo "Download them from the **Artifacts** section at the bottom of this run (kept 30 days)."
            echo ""
            echo "> **Updating over an older build:** debug builds from different runs are signed with"
            echo "> different keys, so Android may refuse to install a newer one over an older one."
            echo "> Uninstall the older build first, then install this one. Phase 7 adds proper signing."
          } >> "$GITHUB_STEP_SUMMARY"
