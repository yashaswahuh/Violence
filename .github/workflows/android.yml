name: Android CI

on:
  push:
    branches: [violence-nk, violence-main, main]
    paths:
      - 'app/**'
      - 'tv/**'
      - 'shared/**'
      - 'sharedUi/**'
      - 'native/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apks:
    name: Build Phone & TV Debug APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup local.properties
        run: |
          if [ -n "$ANDROID_HOME" ]; then
            echo "sdk.dir=$ANDROID_HOME" > local.properties
          fi
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY || '' }}" >> local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET || '' }}" >> local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Phone and TV Debug APKs
        run: ./gradlew :app:assembleDevDebug :tv:assembleDevDebug -Pbitchord.bundleWear=false --stacktrace

      - name: Prepare APK Artifacts
        run: |
          mkdir -p dist-apks
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)

          PHONE_APK=$(find app/build/outputs/apk/dev/debug -name "*universal*.apk" | head -n 1)
          if [ -z "$PHONE_APK" ]; then
            PHONE_APK=$(find app/build/outputs/apk/dev/debug -name "*.apk" | head -n 1)
          fi
          echo "Phone APK found: $PHONE_APK"
          cp "$PHONE_APK" "dist-apks/violence-phone-debug-${SHORT_SHA}.apk"

          TV_APK=$(find tv/build/outputs/apk/dev/debug -name "*universal*.apk" | head -n 1)
          if [ -z "$TV_APK" ]; then
            TV_APK=$(find tv/build/outputs/apk/dev/debug -name "*.apk" | head -n 1)
          fi
          echo "TV APK found: $TV_APK"
          cp "$TV_APK" "dist-apks/violence-tv-debug-${SHORT_SHA}.apk"

          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV

      - name: Upload Phone Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: violence-phone-debug-${{ env.SHORT_SHA }}
          path: dist-apks/violence-phone-debug-*.apk
          retention-days: 30

      - name: Upload TV Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: violence-tv-debug-${{ env.SHORT_SHA }}
          path: dist-apks/violence-tv-debug-*.apk
          retention-days: 30

      - name: Write build summary
        run: |
          echo "### 📱 Android Debug Builds" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Debug APKs were successfully compiled for commit \`${{ env.SHORT_SHA }}\`:" >> $GITHUB_STEP_SUMMARY
          echo "- **Phone APK:** \`violence-phone-debug-${{ env.SHORT_SHA }}.apk\`" >> $GITHUB_STEP_SUMMARY
          echo "- **TV APK:** \`violence-tv-debug-${{ env.SHORT_SHA }}.apk\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> [!NOTE]" >> $GITHUB_STEP_SUMMARY
          echo "> Debug builds from different CI runs use different ephemeral debug signing keys. If installing over a previous build, you may need to uninstall the older APK first before installing this one. Proper release signing will be configured in a later phase." >> $GITHUB_STEP_SUMMARY
