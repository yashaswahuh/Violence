name: Web Deploy

# Builds the web player (and packages the browser extension zips it offers for download) and
# deploys it to GitHub Pages. Runs on a push to violence-nk that touches the web code, or by hand
# (the "Run workflow" button only shows for workflow files on the default branch; until this file is
# merged there, the push trigger on violence-nk is what runs it). See fork-docs/CI_DEPLOY.md.
#
# Optional repository variables (Settings -> Secrets and variables -> Actions -> Variables). The
# build succeeds with every one of them missing:
#   JAM_BACKEND_URL      the Jam server the site defaults to   (empty = the site says Jam is not set up)
#   JAM_INVITE_BASE_URL  where shared party links point        (empty = share only the code)
#   UPDATE_FOLDER        folder on the site that holds the app update files (default: updates)
# No secrets are used: anything baked into a public web page is public.
#
# App updates (fork-docs/RELEASE_GUIDE.md): when a GitHub release is published (or on any later
# deploy), the newest release's update.json and the APKs it lists are copied into the site
# under <UPDATE_FOLDER>/, so the apps can fetch them without a login (a private repo's release
# assets cannot be fetched without one). For the release trigger, the github-pages environment must
# allow the tag pattern v* (Settings -> Environments -> github-pages), see CI_DEPLOY.md.

on:
  push:
    branches: [main, violence-main, violence-nk]
    paths:
      - 'web/**'
      - '.github/workflows/web.yml'
  release:
    types: [published, prereleased]
  public:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build web target
    runs-on: ${{ vars.RUNNER_LINUX || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck and test
        run: |
          pnpm typecheck
          pnpm test

      - name: Build site and extension zips
        run: pnpm build:site
        env:
          # The folder the site is served from (configure-pages reports it: /Violence for this repository).
          VITE_BASE_URL: ${{ steps.pages.outputs.base_path || '/Violence' }}/
          # A published build never answers pages on localhost (web/extension/site.config.ts).
          BITCHORD_STORE_BUILD: '1'
          # Optional, empty when the variables are not set.
          VITE_PARTY_SERVER_URL: ${{ vars.JAM_BACKEND_URL || '' }}
          VITE_INVITE_BASE_URL: ${{ vars.JAM_INVITE_BASE_URL || '' }}

      - name: Check the build is ready for its folder
        env:
          BASE: ${{ steps.pages.outputs.base_path || '/Violence' }}
        run: |
          test -f app/dist/index.html || { echo "::error::no index.html in app/dist"; exit 1; }
          test -f app/dist/404.html || { echo "::error::no 404.html (deep links and refresh need it)"; exit 1; }
          test -f app/dist/robots.txt || { echo "::error::no robots.txt"; exit 1; }
          grep -q 'name="robots" content="noindex' app/dist/index.html || { echo "::error::index.html lost its noindex tag"; exit 1; }
          grep -q "${BASE}/assets/" app/dist/index.html || { echo "::error::index.html does not load its assets from ${BASE}/ (wrong base path)"; exit 1; }
          if grep -qE '(src|href)="/assets/' app/dist/index.html; then echo "::error::index.html has root-absolute asset URLs"; exit 1; fi
          ls app/dist/downloads | sed 's/^/download: /'

      - name: Add the newest release's update files
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_FOLDER: ${{ vars.UPDATE_FOLDER || 'updates' }}
        run: |
          dest="web/app/dist/${UPDATE_FOLDER}"
          mkdir -p "$dest"
          TAG="${{ github.event.release.tag_name || '' }}"
          if [ -z "$TAG" ]; then
            TAG=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 1 | awk '{print $1}')
          fi
          if [ -n "$TAG" ]; then
            echo "Attempting to download update files from release $TAG..."
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'update.json' --dir "$dest" --clobber || true
          fi
          if [ ! -f "$dest/update.json" ]; then
            if ! gh release download --repo "$GITHUB_REPOSITORY" --pattern 'update.json' --dir "$dest" --clobber; then
              echo "No release with update files yet; the site is deployed without an updates folder."
              rm -rf "$dest"
              exit 0
            fi
          fi
          # Only the APKs update.json points at go on the site (the per-CPU ones); the big universal
          # APKs stay in the release for installing by hand.
          for f in $(jq -r '.apks[].url' "$dest/update.json" | sort -u); do
            if [ -n "$TAG" ]; then
              gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$(basename "$f")" --dir "$dest" --clobber || \
                gh release download --repo "$GITHUB_REPOSITORY" --pattern "$(basename "$f")" --dir "$dest" --clobber
            else
              gh release download --repo "$GITHUB_REPOSITORY" --pattern "$(basename "$f")" --dir "$dest" --clobber
            fi
          done
          # Every APK that update.json points at has to be there, or the apps would offer a download that fails.
          node -e '
            const fs = require("fs"), dir = process.argv[1];
            const j = JSON.parse(fs.readFileSync(dir + "/update.json", "utf8"));
            if (!Number.isInteger(j.versionCode) || !j.versionName) throw new Error("update.json has no versionCode/versionName");
            for (const [k, a] of Object.entries(j.apks || {})) {
              const f = dir + "/" + String(a.url).split("/").pop();
              if (!fs.existsSync(f)) throw new Error("update.json lists " + k + " APK " + a.url + " but it is not in the release");
            }
            console.log("update files for " + j.versionName + " (versionCode " + j.versionCode + ") added");
          ' "$dest"
          ls -l "$dest"
          # Files above 100 MB are rejected by GitHub; warn well before that.
          find "$dest" -type f -size +90M -print | sed 's/^/::warning::over 90 MB: /'

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/app/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ${{ vars.RUNNER_LINUX || 'ubuntu-latest' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Write job summary
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          {
            echo "### Web player deployed"
            echo ""
            echo "- **URL:** ${PAGE_URL}"
            echo "- **Intended address:** https://yashaswahuh.is-a.dev/Violence/ (only if yashaswahuh.is-a.dev is the custom domain of your user Pages site; otherwise use the URL above)"
            echo "- **Invite page:** ${PAGE_URL}party/<CODE>"
            echo ""
            echo "> Playback needs the Violence browser extension (see the Extension page on the site)."
            echo "> A Pages site is reachable by anyone who has the URL, even though the repository is private."
          } >> "$GITHUB_STEP_SUMMARY"
