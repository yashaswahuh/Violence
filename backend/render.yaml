# Render blueprint for the Violence Jam server (Go backend)
#
# Easiest: create the service by hand in the Render dashboard (see
# fork-docs/JAM_BACKEND_DEPLOY.md), using the same values as below:
# - New -> Web Service, connect the GitHub repo (branch: violence-nk)
# - Root Directory: backend
# - Runtime: Go    Build Command: go build -o server .    Start Command: ./server
#   (or Runtime: Docker, which uses backend/Dockerfile)
# - Health Check Path: /healthz   Plan: Free   Instances: 1
#   (Parties live in memory, so never run more than one instance.)

services:
  - type: web
    name: violence-jam
    runtime: go
    plan: free
    region: singapore
    branch: violence-nk
    rootDir: backend
    buildCommand: go build -o server .
    startCommand: ./server
    healthCheckPath: /healthz
    numInstances: 1
    envVars:
      # Core group is 4-6 people, friends and family bring it to about 15. The protocol
      # allows up to 15 members in one room (config.MaxPartyMembers); this is the default size.
      - key: JAM_MAX_MEMBERS
        value: "15"
      - key: JAM_STATE_HEARTBEAT_MS
        value: "5000"
      - key: JAM_MAX_UPCOMING_QUEUE
        value: "25"
      - key: JAM_MAX_PARTIES
        value: "50"
      - key: JAM_CREATE_RATE_PER_MINUTE
        value: "6"
      - key: JAM_CONNECTION_IDLE_MS
        value: "900000"
      # Browsers allowed to use the server (native apps send no Origin).
      - key: JAM_ALLOWED_ORIGINS
        value: "https://yashaswahuh.is-a.dev,http://localhost,http://localhost:5173"
      # Render terminates TLS and supplies the real client IP in X-Forwarded-For.
      - key: JAM_TRUST_PROXY
        value: "true"
      # The open-app counter stays off. Do not set JAM_ENABLE_STATS.
      # Optional: the public https origin of this service (shown in invite links),
      # e.g. https://violence-jam.onrender.com . Set it in the dashboard.
      - key: JAM_PUBLIC_ORIGIN
        sync: false