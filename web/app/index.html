<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex, nofollow" />
    <script>
      // Restore deep links redirected from 404.html before router initializes
      (function() {
        var redirect = sessionStorage.getItem('violence_redirect');
        if (redirect) {
          sessionStorage.removeItem('violence_redirect');
          if (redirect !== (location.pathname + location.search + location.hash)) {
            history.replaceState(null, '', redirect);
          }
        }
      })();
      // The extension trusts https://yashaswahuh.is-a.dev only (web/extension/site.config.ts),
      // so www goes there before anything loads, keeping its path and query.
      if (location.hostname === 'www.yashaswahuh.is-a.dev') location.replace('https://yashaswahuh.is-a.dev' + location.pathname + location.search + location.hash);
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1f1f1f" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <title>Violence</title>
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="manifest" href="%BASE_URL%manifest.json" />
    <!-- DM Sans is the app's typeface (web/docs/apple-music-dom.md, "Font"). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..800;1,9..40,400..800&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
