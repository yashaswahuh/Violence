<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Violence</title>
    <script>
      (function () {
        var path = window.location.pathname || '/';
        var search = window.location.search || '';
        var hash = window.location.hash || '';

        // Detect base prefix from current pathname (e.g. /Violence or /violence)
        var baseMatch = path.match(/^\/(?:violence)/i);
        var base = baseMatch ? baseMatch[0] : '/Violence';

        // Handle violence://party/<CODE> web equivalents:
        // /Violence/party/<CODE> or /party/<CODE> -> /Violence/invite/<CODE>
        var partyMatch = path.match(/^(?:\/(?:violence))?\/party\/([A-Za-z0-9]{6})(?:\/.*)?$/i);
        if (partyMatch) {
          path = base + '/invite/' + partyMatch[1].toUpperCase();
        } else if (!path.toLowerCase().startsWith(base.toLowerCase())) {
          path = base + (path.startsWith('/') ? path : '/' + path);
        }

        sessionStorage.setItem('violence_redirect', path + search + hash);
        window.location.replace(base + '/');
      })();
    </script>
  </head>
  <body></body>
</html>
